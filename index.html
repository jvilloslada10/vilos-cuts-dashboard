const $=s=>document.querySelector(s), uid=()=>Math.random().toString(36).slice(2,10), today=new Date();const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const monthFmt=new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'});const pretty=d=>new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'));let state;try{state=JSON.parse(localStorage.getItem('vilos-dashboard'))}catch{}if(!state)state={clients:[],appointments:[],active:'calendar'};state.clients=state.clients||[];state.appointments=state.appointments||[];state.expenses=state.expenses||[];let viewMonth=new Date(today.getFullYear(),today.getMonth(),1),selectedDate=iso(today),statsMode='range',expenseFrom='',expenseTo='';let cloudReady=false,syncTimer=null,syncBusy=false;function save(){state.updatedAt=Date.now();localStorage.setItem('vilos-dashboard',JSON.stringify(state));if(cloudReady)scheduleCloudSync()}let correctedServiceNames=false;state.appointments.forEach(a=>{if(a.done&&a.date>='2026-11-18'&&a.date<=iso(today)){if(String(a.service||'').trim().toLocaleLowerCase('es')==='corte de pelo'){a.service='Corte';correctedServiceNames=true}if(String(a.note||'').trim().toLocaleLowerCase('es')==='corte de pelo'){a.note='Corte';correctedServiceNames=true}}});if(correctedServiceNames)save();const tabs=[['calendar','▦','Agenda'],['stats','◷','Estadísticas'],['clients','♙','Clientes'],['expenses','−','Gastos']];function nav(){['sideNav','mobileNav'].forEach(id=>{const el=$('#'+id);el.innerHTML=tabs.map(([key,ic,name])=>`<button class="${state.active===key?'active':''}" data-page="${key}">${id==='sideNav'?`<span class="nav-icon">${ic}</s function cloudConfig(){const c=window.VILOS_CLOUD_CONFIG||{};return {url:String(c.supabaseUrl||'').replace(/\/+$/,''),key:String(c.anonKey||'')}}

function scheduleCloudSync(){clearTimeout(syncTimer);setSyncStatus('Guardando cambios…');syncTimer=setTimeout(async()=>{try{await writeCloudState();setSyncStatus('Sincronizado')}catch(e){console.warn(e);setSyncStatus('Sin conexión · guardado local')}} ,450)}
async function reconcileCloud(){if(syncBusy||!cloudReady)return;syncBusy=true;try{const remote=await readCloudState();if(!remote){await writeCloudState();setSyncStatus('Sincronizado');return}const localTime=Number(state.updatedAt)||0,remoteTime=Number(remote.updatedAt)||0;if(remoteTime>localTime){const active=state.active;state={...remote,active,clients:remote.clients||[],appointments:remote.appointments||[],expenses:remote.expenses||[]};localStorage.setItem('vilos-dashboard',JSON.stringify(state));render()}else if(localTime>remoteTime){await writeCloudState()}setSyncStatus('Sincronizado')}catch(e){console.warn(e);setSyncStatus('Sin conexión · guardado local')}finally{syncBusy=false}}
async function initializeCloud(){const c=cloudConfig();if(!c.url||!c.key){setSyncStatus('Solo este dispositivo');render();return}setSyncStatus('Conectando a la nube…');try{const remote=await readCloudState();if(remote){const active=state.active,localTime=Number(state.updatedAt)||0,remoteTime=Number(remote.updatedAt)||0,preferLocal=localTime>remoteTime;const clients=mergeCloudRecords(remote.clients,state.clients,preferLocal),appointments=mergeCloudRecords(remote.appointments,state.appointments,preferLocal),expenses=mergeCloudRecords(remote.expenses,state.expenses,preferLocal),hasRecovery=clients.length!==(remote.clients||[]).length||appointments.length!==(remote.appointments||[]).length||expenses.length!==(remote.expenses||[]).length;state={...remote,active,clients,appointments,expenses,historicalIncomeImported:!!(remote.historicalIncomeImported||state.historicalIncomeImported),cloudInitialized:true,updatedAt:hasRecovery?Date.now():Math.max(localTime,remoteTime)};localStorage.setItem('vilos-dashboard',JSON.stringify(state));if(hasRecovery||preferLocal)await writeCloudState()}else{state.cloudInitialized=true;state.updatedAt=Date.now();await writeCloudState();localStorage.setItem('vilos-dashboard',JSON.stringify(state))}cloudReady=true;setSyncStatus('Sincronizado');render();window.addEventListener('focus',reconcileCloud);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reconcileCloud()});setInterval(reconcileCloud,30000)}catch(e){console.warn(e);cloudReady=true;setSyncStatus('Sin conexión · guardado local');render()}}
function openModal(title,sub,body){$('#modalTitle').textContent=title;$('#modalSub').textContent=sub||'';$('#modalBody').innerHTML=body;$('#modalBack').classList.add('open')}function closeModal(){$('#modalBack').classList.remove('open')}$('#closeModal').onclick=closeModal;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};function clientModal(id){const c=state.clients.find(c=>c.id===id),edit=!!c,parts=clientParts(c),fullName=edit?(parts.given?parts.given+' '+parts.surname:parts.surname):'';openModal(edit?'Editar cliente':'Añadir cliente',edit?'Actualiza sus datos':'Escribe nombre y apellido',`<div class="form-grid"><div class="form-field"><label>Nombre y apellido *</label><input id="cFullName" value="${esc(fullName)}" placeholder="Ej. Alex García" autocomplete="name" autofocus></div><div class="form-error" id="formError">Escribe el nombre y el apellido para continuar.</div></div><div class="modal-actions"><button class="btn btn-light" id="cancel">Cancelar</button><button class="btn btn-dark" id="saveClient">${edit?'Guardar cambios':'Guardar cliente'}</button></div>`);$('#cancel').onclick=closeModal;$('#saveClient').onclick=()=>{const name=$('#cFullName').value.trim().replace(/\s+/g,' ');if(name.split(' ').filter(Boolean).length<2){$('#formError').style.display='block';$('#cFullName').focus();return}if(edit)c.name=name;else state.clients.push({id:uid(),name});save();closeModal();render()};$('#cFullName').focus()}
function clientDetail(id,from='',to=''){const c=client(id);if(!c)return;const visits=state.appointments.filter(a=>a.clientId===id&&a.done&&(!from||a.date>=from)&&(!to||a.date<=to)).sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));openModal(clientDisplay(c),'Visitas realizadas',`<div class="stats-controls" style="margin:0 0 14px;padding:12px"><div class="field"><label>Desde</label><input type="date" id="clientFrom" value="${from}"></div><div class="field"><label>Hasta</label><input type="date" id="clientTo" value="${to}"></div></div><div class="muted-text" style="font-size:12px;margin-bottom:8px">${visits.length} ${visits.length===1?'visita realizada':'visitas realizadas'}</div>${visits.length?visits.map(a=>`<div class="day-row"><div><div class="row-name">${pretty(a.date)}</div><div class="row-sub">${esc(a.note||a.service||'Corte')}</div></div><span class="price">${money(a.price)}</span></div>`).join(''):'<div class="empty">No hay visitas realizadas en este periodo.</div>'}`);$('#clientFrom').onchange=()=>clientDetail(id,$('#clientFrom').value,$('#clientTo').value);$('#clientTo').onchange=()=>clientDetail(id,$('#clientFrom').value,$('#clientTo').value)}function removeClient(id){const c=client(id);if(!c)return;openModal('Eliminar cliente',c.name,`<p style="color:#666;font-size:13px;line-height:1.6">Se eliminará el cliente de tu lista. Las citas existentes se conservarán en el calendario.</p><div class="modal-actions"><button class="btn btn-light" id="cancel">Cancelar</button><button class="btn" style="background:#b64536;color:white" id="confirmRemove">Eliminar cliente</button></div>`);$('#cancel').onclick=closeModal;$('#confirmRemove').onclick=()=>{state.clients=state.clients.filter(x=>x.id!==id);save();closeModal();render()}}

tName||clientDisplay(c).toLocaleLowerCase('es')===inputName);const price=Number($('#aPrice').value),time=$('#aTime').value,appointmentDate=$('#aDate').value||date;if(!found||!time||$('#aPrice').value===''||!Number.isFinite(price)||price<0){$('#formError').style.display='block';return}const appointmentTime=new Date(`${appointmentDate}T${time}:00`);const alreadyPassed=appointmentTime.getTime()<Date.now();state.appointments.push({id:uid(),clientId:found.id,date:appointmentDate,time,price,done:alreadyPassed,service:services[Number($('#aService').value)].name,note:services[Number($('#aService').value)].name});selectedDate=appointmentDate;viewMonth=new Date(selectedDate+'T12:00:00');save();closeModal();render()};$('#clientQuery').focus()}const historicalIncome=[

];
if(!state.historicalIncomeImported){let n=0;historicalIncome.forEach(([date,amount])=>{const prices=amount===22?[10,12]:amount===12?[12]:Array.from({length:amount/(date<='2026-05-22'?8:10)},()=>date<='2026-05-22'?8:10);prices.forEach(price=>{n++;const special=date==='2026-10-15'&&price===12;state.appointments.push({id:'historical-vilos-'+String(n).padStart(3,'0'),clientId:null,date,time:'00:00',timeUnknown:true,price,done:true,historical:true,service:special?'Corte y cejas':'Corte',note:special?'Corte y cejas':'Corte'})})});state.historicalIncomeImported=true;save()}
